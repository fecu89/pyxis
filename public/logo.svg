<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- 깨끗한 단색 배경색 (심플함을 강조) -->
    <solidColor id="bgFill" color-value="#1E293B" /> 
  </defs>

  <title>FixPad Simplified Logo</title>

  <!-- 1. 심플한 배경 패드 (단색) -->
  <rect x="20" y="15" width="80" height="90" rx="14" fill="#1E293B" />

  <!-- 2. 나침반 아우터 링 (간결한 흰색 선) -->
  <circle cx="60" cy="60" r="28" stroke="#ffffff" stroke-width="2" fill="none" />

  <!-- 방향 마커 (N, S, E, W - 점으로 단순화) -->
  <circle cx="60" cy="38" r="1.5" fill="#ffffff" />
  <circle cx="60" cy="82" r="1.5" fill="#ffffff" />
  <circle cx="38" cy="60" r="1.5" fill="#ffffff" />
  <circle cx="82" cy="60" r="1.5" fill="#ffffff" />

  <!-- 3. 나침반 바늘 & 펜촉 (동시에 표현 - 단색/이색 조합) -->
  <g transform="rotate(45, 60, 60)">
    <!-- 북쪽/펜촉 바늘 (흰색으로 강조) -->
    <polygon points="60,32 50,60 60,60" fill="#ffffff" /> 
    <polygon points="60,32 70,60 60,60" fill="#ffffff" /> 
    
    <!-- 남쪽 바늘 (부드러운 파란색으로 구분) -->
    <polygon points="60,88 50,60 60,60" fill="#38BDF8" /> 
    <polygon points="60,88 70,60 60,60" fill="#38BDF8" /> 
    
    <!-- 중앙 회전축 핀 (단순화된 점) -->
    <circle cx="60" cy="60" r="3" fill="#ffffff" />
    <circle cx="60" cy="60" r="1.5" fill="#1E293B" />
  </g>
</svg>
